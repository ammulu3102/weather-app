<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <input type="text" placeholder="Enter City" class="input-btn" />
      <button type="submit" class="submit-btn">Get weather</button>
      <form class="weather-form" style="display: none" ;>
        <h1 class="city">City</h1>
        <p class="tempdata">temp</p>
        <p class="humidity">Humidity</p>
        <p class="descdata">Description:</p>
        <p class="emoji">☀️</p>
      </form>
    </div>
    <script src="weather.js"></script>
  </body>
</html>
